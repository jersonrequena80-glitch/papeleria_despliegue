<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papelería Online - Catálogo Oficial</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-book-bookmark"></i> <span>Papelería Online</span>
    </div>
    <div class="cart-icon-container" id="open-cart-btn">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="cart-badge" id="cart-count">0</span>
    </div>
  </header>

  <section class="hero">
    <h1>Útiles Escolares y de Oficina a un Clic</h1>
    <p>Todo lo que necesitas para tu colegio, universidad o empresa con entrega inmediata.</p>
  </section>

  <main class="container">
    <h2 class="section-title">Catálogo de Productos</h2>
    <div class="products-grid" id="products-container"></div>
  </main>

  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h3>Mi Carrito</h3>
      <button class="close-btn" id="close-cart-btn">&times;</button>
    </div>
    <div class="cart-body" id="cart-items-container">
      <p class="empty-message">Tu carrito está vacío.</p>
    </div>
    <div class="cart-footer">
      <div class="total-row">
        <span>Total:</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button class="checkout-btn" id="checkout-btn">Proceder al Pago</button>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <footer>
    <p>&copy; 2026 Papelería Online. Diseñado para Evidencia GA10-220501097-AA3-EV01.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
